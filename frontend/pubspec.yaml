name: queueme_frontend
description: The mobile application for QueueMe.
publish_to: 'none' # Remove this line if you intend to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Adjusted to a more current SDK range

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons are included by default with Flutter.
  cupertino_icons: ^1.0.2

  # Add other common packages here:
  http: ^1.1.0 # For making HTTP requests (latest version as of writing)
  provider: ^6.0.5 # For state management (latest version as of writing)
  shared_preferences: ^2.2.0 # For simple data persistence (latest version as of writing)
  # flutter_secure_storage: ^9.0.0 # For more secure storage, if needed later

  # socket_io_client: ^2.0.0 # For real-time communication if using Socket.IO
  # firebase_core: ^2.0.0 # If using Firebase
  # firebase_messaging: ^14.0.0 # For Firebase Cloud Messaging

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0 # For static analysis

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An example of adding custom fonts to your application:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
